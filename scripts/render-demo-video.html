<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minimi demo video renderer</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f0efe9;color:#292e28;font:14px system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.wrap{width:min(1000px,100%)}h1{font:500 30px Georgia,serif;margin:0 0 8px}p{color:#6f756c;line-height:1.6}.stage{background:#20251f;border-radius:14px;overflow:hidden;box-shadow:0 20px 70px #252a2025}canvas{display:block;width:100%;height:auto}footer{display:flex;gap:12px;align-items:center;margin-top:16px}button,a{border:0;border-radius:8px;padding:11px 15px;background:#3e694c;color:white;font:600 13px system-ui;text-decoration:none;cursor:pointer}button:disabled{opacity:.45;cursor:wait}#status{color:#73786f;font:12px ui-monospace,monospace}.notice{font-size:11px;color:#878a81}</style></head>
<body><main class="wrap"><h1>Minimi · 60-second walkthrough</h1><p>Render the captioned product tour locally, then download the WebM for the app’s demo player.</p><div class="stage"><canvas id="c" width="1280" height="720"></canvas></div><footer><button id="start">Render 60-second video</button><a id="download" hidden>Download WebM</a><span id="status">Ready · 1280 × 720 · 30 fps</span></footer><p class="notice">The storyboard shows an illustrative sample flow; it is not a live model session.</p></main>
<script>
const c=document.querySelector('#c'),x=c.getContext('2d'),start=document.querySelector('#start'),download=document.querySelector('#download'),status=document.querySelector('#status'),W=1280,H=720;
const C={paper:'#f6f5f0',white:'#fffefa',ink:'#252b27',muted:'#777c73',line:'#e7e5dc',green:'#3e694c',soft:'#e7ede4',blue:'#e8edf0',sand:'#f2eae0'};
function rr(px,py,w,h,r,fill,stroke){x.beginPath();x.roundRect(px,py,w,h,r);if(fill){x.fillStyle=fill;x.fill()}if(stroke){x.strokeStyle=stroke;x.lineWidth=1;x.stroke()}}
function txt(s,px,py,size=18,color=C.ink,font='Arial',weight='400'){x.fillStyle=color;x.font=weight+' '+size+'px '+font;x.fillText(s,px,py)}
function wrap(s,px,py,max,size=16,color=C.muted,line=25,font='Arial',weight='400'){x.font=weight+' '+size+'px '+font;x.fillStyle=color;let words=s.split(' '),row='',yy=py;for(const word of words){const test=row?row+' '+word:word;if(x.measureText(test).width>max&&row){x.fillText(row,px,yy);row=word;yy+=line}else row=test}if(row)x.fillText(row,px,yy)}
function base(){x.fillStyle=C.paper;x.fillRect(0,0,W,H);x.fillStyle='#f0efe8';x.fillRect(0,0,288,H);x.strokeStyle=C.line;x.beginPath();x.moveTo(288,0);x.lineTo(288,H);x.stroke();rr(30,27,30,30,9,C.green);txt('✳',37,48,16,'#fff','Arial','600');txt('minimi',69,50,27,C.ink,'Georgia','600');rr(22,92,244,43,9,C.white,C.line);txt('+',38,120,18,C.green);txt('New conversation',61,119,13,'#404940','Arial','600');txt('YOUR LIBRARY',31,173,10,'#888d82','monospace','400');x.fillStyle=C.line;x.fillRect(31,192,190,1)}
function heading(kicker,title,sub){txt(kicker.toUpperCase(),350,188,11,'#849080','monospace','500');txt(title,346,258,42,C.ink,'Georgia','500');wrap(sub,350,302,730,17,C.muted,26)}
function history(label,active=false,y=216){if(active)rr(20,y-25,248,39,7,'#e2e8df');txt('◷',34,y,15,active?C.green:'#9da095');txt(label,59,y,12,active?'#38523c':'#70766e','Arial',active?'600':'400')}
function source(y,label,n){rr(352,y,370,42,8,C.white,C.line);rr(365,y+9,22,22,6,C.soft);txt(String(n).padStart(2,'0'),370,y+25,9,C.green,'monospace');txt(label,399,y+26,12,'#657062');txt('↗',696,y+25,13,'#9ba295')}
function assistant(text,y){rr(342,y-23,24,24,7,C.green);txt('✳',347,y-6,11,'white');txt('MINIMI  ·  RESEARCH NOTE',376,y-7,10,'#7c8478','monospace','500');wrap(text,342,y+24,790,16,'#3e453e',26)}
function scene(t){const i=Math.min(5,Math.floor(t/10)),p=(t-i*10)/10;x.clearRect(0,0,W,H);x.save();x.globalAlpha=i===5?Math.min(1,p*10/.65):Math.min(1,p*10/.65,(1-p)*10/.65);
 if(i===0){x.fillStyle=C.paper;x.fillRect(0,0,W,H);rr(73,56,1134,608,22,C.white,C.line);rr(73,56,1134,52,22,'#f1f0e9');txt('minimi',111,91,21,C.ink,'Georgia','600');txt('A THOUGHTFUL RESEARCH WORKSPACE',111,220,11,'#899081','monospace','500');txt('Research that',108,332,70,C.ink,'Georgia','500');txt('remembers.',108,410,70,C.green,'Georgia','400');wrap('Live web search, persistent conversation memory, and sources you can follow.',112,462,700,20,C.muted,31);rr(1022,509,104,104,52,C.green);txt('▶',1058,572,27,'#fff')}
 if(i===1){base();history('CRM shortlist · team of 20',true,216);history('Postgres hosting options',false,258);history('Pricing review · October',false,300);heading('01 · Start with the question','Pick up where you left off.','A question can include a date, a decision, or details from an earlier conversation.');rr(650,382,475,61,12,'#e8eee4','#dce5d9');wrap('On Monday we shortlisted CRM tools for a 20-person sales team. Has anything changed?',670,406,430,13,'#354637',20);txt('Ask what changed since the shortlist.',350,526,13,'#92958b','monospace')}
 if(i===2){base();history('CRM shortlist · team of 20',true,216);history('Postgres hosting options',false,258);history('Pricing review · October',false,300);heading('02 · Context comes back','The useful details stay close.','Minimi searches local chat history for the relevant earlier thread before it answers.');rr(342,360,773,100,11,C.white,C.line);txt('EARLIER THREAD  ·  MONDAY',360,387,10,'#879080','monospace','500');txt('5 CRM tools · 20-person team · shortlist',360,424,16,'#394139','Georgia','500');rr(342,485,773,40,8,'#f1f0e9');txt('Relevant context is selected for this follow-up.',362,510,12,'#72796e')}
 if(i===3){base();heading('03 · Fresh research','Then it checks what changed.','Current questions trigger web search. Past answers are context to verify, not proof.');rr(350,366,360,133,12,C.white,C.line);txt('LAST TIME',372,401,10,'#96998f','monospace');txt('Previous answer',372,441,20,C.ink,'Georgia');txt('Saved with its conversation date',372,471,12,C.muted);rr(744,366,380,133,12,'#edf1e8','#dce4d7');txt('CHECKED NOW',766,401,10,C.green,'monospace');txt('Fresh web search',766,441,20,C.ink,'Georgia');txt('Pricing · release notes · changelogs',766,471,12,C.muted);txt('Compare the earlier claim with current sources.',350,548,13,'#92958b','monospace')}
 if(i===4){base();heading('04 · Evidence stays visible','Every answer shows its work.','Citations sit beside an answer so you can open the source and check the detail yourself.');assistant('Changes may have landed since the earlier shortlist. Compare current plan details and release notes before deciding.',366);source(490,'Official pricing pages',1);source(542,'Product updates and release notes',2);source(594,'Current documentation',3)}
 if(i===5){x.fillStyle=C.paper;x.fillRect(0,0,W,H);rr(90,64,1100,592,24,C.white,C.line);rr(140,127,46,46,13,C.green);txt('✳',151,158,19,'white');txt('minimi',202,164,35,C.ink,'Georgia','600');txt('WEB SEARCH  ·  LOCAL MEMORY  ·  SOURCE LINKS',146,257,11,'#879080','monospace','500');txt('The best follow-up',144,354,54,C.ink,'Georgia','500');txt('starts with context.',144,414,54,C.green,'Georgia','400');wrap('Minimi — research, remembered.',148,470,710,19,C.muted,28);rr(148,536,292,51,9,C.green);txt('Explore the interactive app',169,569,14,'#fff','Arial','600');txt('A 60-second illustrative tour',149,620,11,'#92958b','monospace')}
 x.restore();if(i<5){const captions=['Questions today. Context from yesterday.','Ask about a change since your shortlist.','Relevant history comes forward automatically.','Fresh search keeps yesterday’s answer honest.','Follow the links. Verify important details.'];rr(0,664,W,56,0,'#252b27e8');txt(captions[i],56,699,16,'#fff','Georgia','400')}else{rr(0,681,W,39,0,'#252b27e8');txt('Illustrative walkthrough · sample content',54,706,11,'#fff','monospace','400')}}
scene(6.5);
start.onclick=()=>{start.disabled=true;download.hidden=true;status.textContent='Rendering 0 / 60 seconds…';const stream=c.captureStream(30),mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm',recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:1500000}),parts=[];recorder.ondataavailable=e=>{if(e.data.size)parts.push(e.data)};recorder.onstop=()=>{const blob=new Blob(parts,{type:'video/webm'});download.href=URL.createObjectURL(blob);download.download='minimi-demo.webm';download.hidden=false;status.textContent='Done · 60 seconds · '+(blob.size/1048576).toFixed(1)+' MB';start.disabled=false};const began=performance.now();recorder.start(1000);function tick(now){const t=(now-began)/1000;scene(Math.min(t,59.999));status.textContent='Rendering '+Math.min(60,Math.floor(t))+' / 60 seconds…';if(t>=60){scene(59.999);recorder.stop();stream.getTracks().forEach(track=>track.stop());return}requestAnimationFrame(tick)}requestAnimationFrame(tick)};
</script></body></html>
